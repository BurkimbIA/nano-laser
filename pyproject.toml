[project]
name = "nano-laser"
version = "0.1.0"
description = "LASER sentence encoders in plain torch: a drop-in replacement for laser_encoders, without fairseq"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "MNIKIEMA", email = "nikiemamahamadi01@gmail.com" },
    { name = "Salif Sawadogo", email = "sawallesalfo@gmail.com" },
    { name = "Facebook AI Research" },  # LASER and laser_encoders, which this package adapts
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.3",
    "sacremoses==0.1.0",  # the version laser_encoders pins: punctuation normalisation must not drift
    "sentencepiece>=0.1.99",
    "torch>=2.5",
    "unicategories>=0.1.2",
]

[project.urls]
Homepage = "https://github.com/BurkimbIA/nano-laser"
Repository = "https://github.com/BurkimbIA/nano-laser"
Changelog = "https://github.com/BurkimbIA/nano-laser/blob/main/CHANGELOG.md"
Issues = "https://github.com/BurkimbIA/nano-laser/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nano_laser"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.14.10",
]


[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"**/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["nano_laser"]

[tool.ruff.format]
# Use double quotes for strings.
quote-style = "double"

# Indent with spaces, rather than tabs.
indent-style = "space"

# Respect magic trailing commas.
skip-magic-trailing-comma = false

# Auto detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testspath = [
    "tests"
]
addopts = "-ra -q"
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning"
]