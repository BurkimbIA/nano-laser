name: parity

# Embeddings against laser_encoders, with the real models (1.9 GB, cached): only when the code or the tests change.
on:
  pull_request:
    paths:
      - 'src/nano_laser/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/parity.yml'

jobs:
  parity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
          version: "latest"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Cache the LASER models
        uses: actions/cache@v4
        with:
          path: ~/.cache/laser_encoders
          key: laser-models-${{ hashFiles('tests/test_parity.py') }}
          restore-keys: |
            laser-models-

      - name: Check parity with laser_encoders
        env:
          LASER_PARITY_REQUIRED: "1"  # download a missing model instead of skipping
        run: uv run pytest tests/test_parity.py
